<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <img class="school-logo" src="logosekolah.jpg" alt="Logo SMKN 1 Rengasdengklok">
        <div class="header-copy">
            <h1>Kontak Kami</h1>
            <p>Kirim pesan kepada saya</p>
        </div>
        <span class="header-spacer" aria-hidden="true"></span>
    </header>

    <nav>
        <a href="index.html">Beranda</a> |
        <a href="about.html">Profil</a> |
        <a href="kontak.html">Kontak</a>
    </nav>

    <div class="content">
        <div class="card">
            <h2 class="section-title">Formulir Pesan</h2>
            <form class="contact-form">
                <label for="nama">Nama</label>
                <input id="nama" name="nama" type="text">

                <label for="email">Email</label>
                <input id="email" name="email" type="email">

                <label for="pesan">Pesan</label>
                <textarea id="pesan" name="pesan"></textarea>

                <button type="submit">Kirim</button>
            </form>
            <p class="form-note">* Catatan: Formulir ini hanya tampilan depan dan belum menyimpan data karena belum menggunakan basis data.</p>
        </div>
    </div>

    <footer>
